[workspace]
authors = ["zhengzaixuexi233 <wmoyouxiang@gmail.com>"]
channels = ["conda-forge"]
name = "yolo_tool"
platforms = ["win-64", { name = "gpu-win-64", platform = "win-64", cuda = "13.0" }]
version = "0.1.0"

[tasks]
test = "pytest src/tests -q -o cache_dir=.pixi/pytest-cache"
test-fast = "pytest src/tests/services src/tests/architecture src/tests/integration/test_app_entry.py -q -o cache_dir=.pixi/pytest-cache"
test-full = "pytest src/tests -q -o cache_dir=.pixi/pytest-cache"
test-ui = "pytest src/tests/ui -q -o cache_dir=.pixi/pytest-cache"
test-integration = "pytest src/tests/integration -q -o cache_dir=.pixi/pytest-cache"
app = "python -m src.main"
app-qt = "python -m src.main"
check = "python -m compileall src"

[dependencies]
python = "3.12.*"
7zip = ">=24, <27"

[pypi-dependencies]
pyside6 = ">=6.10.0, <7"
pillow = ">=12.2.0, <13"
ultralytics = ">=8.4.80, <9"
opencv-python = ">=4.13.0.92, <5"
numpy = ">=2, <2.3"
pyyaml = ">=6.0.3, <7"
scikit-learn = ">=1.9.0, <2"
psutil = ">=7.2.2, <8"
pytest = ">=9.1.1, <10"
matplotlib = ">=3.11.0, <4"
pyinstaller = ">=6.17.0, <7"
lap = ">=0.5.13, <0.6"
onnx = ">=1.22.0, <2"
onnxslim = ">=0.1.94, <0.2"
onnxscript = ">=0.7.1, <0.8"
py7zr = ">=1.0.0, <2"
sam2 = { path = "installer/vendor/sam2-1.1.0-cp312-cp312-win_amd64.whl" }
sam3 = { path = "installer/vendor/sam3-0.1.0-py3-none-any.whl" }
timm = ">=1.0.17, <2"
ftfy = "==6.1.1"
regex = ">=2024.0.0, <2027"
iopath = ">=0.1.10, <0.2"
huggingface-hub = ">=0.30, <1"
einops = ">=0.8, <1"
pycocotools = ">=2.0.7, <3"
tqdm = ">=4.69.0, <5"
portalocker = ">=3.2.0, <4"
nncf = ">=2.14.0, <3"

[feature.cpu.pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cpu" }
torchaudio = { version = "*", index = "https://download.pytorch.org/whl/cpu" }

[feature.gpu.pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
torchaudio = { version = "*", index = "https://download.pytorch.org/whl/cu130" }

[feature.release-cpu.pypi-dependencies]
onnxruntime = ">=1.27.0, <2"
nncf = ">=2.14.0, <3"
openvino = ">=2026.2.1, <2027"
openvino-telemetry = ">=2025.2.0, <2027"
ncnn = ">=1.0.20260526"
pnnx = ">=20260526"

[feature.release-gpu.pypi-dependencies]
onnxruntime-gpu = ">=1.27.0, <2"
nncf = ">=2.14.0, <3"
openvino = ">=2026.2.1, <2027"
openvino-telemetry = ">=2025.2.0, <2027"
ncnn = ">=1.0.20260526"
pnnx = ">=20260526"
tensorrt = ">=11.1.0.106, <12"
tensorrt-cu13 = { version = "==11.1.0.106", index = "https://pypi.nvidia.com" }
tensorrt-cu13-libs = { version = "==11.1.0.106", index = "https://pypi.nvidia.com" }
tensorrt-cu13-bindings = { version = "==11.1.0.106", index = "https://pypi.nvidia.com" }

[environments]
default = ["gpu", "release-gpu"]
release-gpu = ["gpu", "release-gpu"]
release-cpu = ["cpu", "release-cpu"]
